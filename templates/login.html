<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - پنل مدیریت</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2c1810, #4a2c1a);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 { text-align: center; color: #2c1810; margin-bottom: 10px; }
        .login-box p { text-align: center; color: #a08060; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #5c4033; }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0d5c5;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: #ffd700; }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,215,0,0.3); }
        .error {
            background: #fde8e8;
            color: #e74c3c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>💍 پنل مدیریت</h1>
        <p>سیستم کارت دعوت عروسی</p>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" name="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" name="password" required placeholder="admin">
            </div>
            <button type="submit" class="btn">🔐 ورود</button>
        </form>
    </div>
</body>
</html>
